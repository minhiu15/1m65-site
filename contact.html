<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Liên hệ khách · 1M65 Nails</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./contact.css">
</head>
<body>
  <main class="contact-shell">
    <section class="contact-card" aria-labelledby="contact-title">
      <a class="brand" href="./admin.html">1M65 <span>Nails</span></a>
      <p class="eyebrow">Liên hệ khách hàng</p>
      <h1 id="contact-title">Bạn muốn liên hệ cách nào?</h1>
      <p id="customer-phone" class="customer-phone" aria-live="polite">Đang đọc số điện thoại…</p>
      <div id="contact-actions" class="contact-actions" hidden>
        <a id="call-customer" class="action action-call">📞 Gọi khách</a>
        <a id="zalo-customer" class="action action-zalo" target="_blank" rel="noopener noreferrer">💬 Tìm trên Zalo</a>
      </div>
      <p id="contact-note" class="contact-note">Zalo chỉ tìm được khi khách cho phép tìm kiếm tài khoản bằng số điện thoại.</p>
      <button id="back-button" class="back-button" type="button">Quay lại</button>
    </section>
  </main>
  <script src="./contact.js" defer></script>
</body>
</html>
