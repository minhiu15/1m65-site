<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tiệm nail nhỏ ở TP.HCM dành cho những buổi chiều thật chậm, thật êm.">
  <meta property="og:title" content="1M65 Nails · Lashes · Shampoo">
  <meta property="og:description" content="Tiệm nail nhỏ ở TP.HCM dành cho những buổi chiều thật chậm, thật êm.">
  <meta property="og:image" content="./og.png">
  <title>1M65 Nails · Lashes · Shampoo</title>
  <link rel="icon" href="./favicon.svg">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fffcf9}
    main,iframe{display:block;width:100%;height:100%;border:0;background:#fffcf9}
    .mobile{display:none}
    .manage-appointment-link{position:fixed;right:18px;bottom:18px;z-index:20;display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border:1px solid rgba(122,90,208,.22);border-radius:999px;color:#5f479e;background:rgba(255,255,255,.94);box-shadow:0 14px 34px -20px rgba(67,43,108,.72);font:700 13px/1 system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(12px)}
    .manage-appointment-link:hover{background:#f7f2ff}
    .booking-modal[hidden]{display:none}
    .booking-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(43,36,64,.52);backdrop-filter:blur(12px);animation:booking-modal-in .2s ease-out}
    .booking-modal__panel{position:relative;width:min(1120px,100%);height:min(900px,90vh);overflow:hidden;border:1px solid rgba(255,255,255,.76);border-radius:32px;background:#fffaf7;box-shadow:0 36px 90px -28px rgba(30,19,55,.72)}
    .booking-modal__frame{width:100%;height:100%;border:0;background:#fffaf7}
    .booking-modal__close{position:absolute;top:14px;right:14px;z-index:2;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid rgba(122,90,208,.2);border-radius:50%;color:#5f479e;background:rgba(255,255,255,.94);box-shadow:0 12px 28px -18px rgba(43,36,64,.7);font:500 27px/1 system-ui,sans-serif;cursor:pointer}
    .booking-modal__close:hover{background:#f7f2ff}
    @keyframes booking-modal-in{from{opacity:0}to{opacity:1}}
    @media(max-width:767px){.desktop{display:none}.mobile{display:block}}
    @media(max-width:600px){.booking-modal{padding:0}.booking-modal__panel{width:100%;height:100%;border:0;border-radius:0}.booking-modal__close{top:10px;right:10px}}
  </style>
</head>
<body>
  <main>
<iframe class="desktop" src="./1m65%20Nails.dc.html?v=20260808form2" title="1M65 Nails"></iframe>
<iframe class="mobile" src="./site-mobile.html?v=20260808form2" title="1M65 Nails phiên bản di động"></iframe>
  </main>
  <a class="manage-appointment-link" href="manage-booking.html" data-booking-modal-open>Xem và chỉnh lịch hẹn</a>
  <section class="booking-modal" id="booking-modal" role="dialog" aria-modal="true" aria-label="Xem và chỉnh lịch hẹn" hidden>
    <div class="booking-modal__panel">
      <button class="booking-modal__close" type="button" aria-label="Đóng cửa sổ quản lý lịch">×</button>
      <iframe class="booking-modal__frame" id="booking-modal-frame" title="Xem và chỉnh lịch hẹn"></iframe>
    </div>
  </section>
  <script src="booking-management-modal.js?v=20260809-1"></script>
  <script src="booking-management-entry.js?v=20260809-6"></script>
</body>
</html>
