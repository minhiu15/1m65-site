<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tiệm nail nhỏ ở Đại Phước, Đồng Nai dành cho những buổi chiều thật chậm, thật êm.">
  <meta property="og:title" content="1M65 Nails, Eyelashes, Shampoo">
  <meta property="og:description" content="Tiệm nail nhỏ ở Đại Phước, Đồng Nai dành cho những buổi chiều thật chậm, thật êm.">
  <meta property="og:image" content="./og.png">
  <title>1M65 Nails, Eyelashes, Shampoo</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./rose-theme.css?v=20260810rose7">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fffcf9}
    main,iframe{display:block;width:100%;height:100%;border:0;background:#fffcf9}
    .mobile{display:none}
    .manage-appointment-link{position:fixed;right:18px;bottom:18px;z-index:20;display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border:1px solid rgba(122,90,208,.22);border-radius:999px;color:#5f479e;background:rgba(255,255,255,.94);box-shadow:0 14px 34px -20px rgba(67,43,108,.72);font:700 13px/1 system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(12px)}
    .manage-appointment-link:hover{background:#f7f2ff}
    .manage-appointment-link[hidden]{display:none}
    .booking-modal[hidden]{display:none}
    .booking-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(43,36,64,.3);backdrop-filter:blur(7px)}
    .booking-modal__panel{position:relative;width:min(1080px,100%);height:min(840px,calc(100vh - 48px));max-height:calc(100vh - 48px);overflow:hidden;border-radius:44px;background:#fffcf9;box-shadow:0 58px 132px -38px rgba(43,36,64,.58)}
    .booking-modal__frame{width:100%;height:100%;border:0;background:#fffcf9}
    .booking-modal__close{position:absolute;top:30px;right:46px;z-index:2;width:46px;height:46px;display:grid;place-items:center;padding:0;border:1px solid rgba(122,90,208,.14);border-radius:16px;background:#fff;cursor:pointer;transition:background .25s ease}
    .booking-modal__close:hover{background:#f1ecfe}
    .booking-modal__close svg{display:block;width:14px;height:14px}
    @media(min-width:601px){.booking-modal__frame{width:calc(100% - 10px)}}
    @media(max-width:767px){.desktop{display:none}.mobile{display:block}}
    @media(max-width:600px){.booking-modal{padding:20px;background:rgba(43,36,64,.38)}.booking-modal__panel{width:100%;height:calc(100dvh - 40px);max-height:calc(100dvh - 40px);border-radius:28px;box-shadow:0 24px 64px -20px rgba(43,36,64,.52)}.booking-modal__frame{width:calc(100% - 8px)}.booking-modal__close{top:22px;right:22px;width:44px;height:44px;border-radius:14px}}
  </style>
</head>
<body>
  <main>
<iframe class="desktop" src="./1m65%20Nails.dc.html?v=20260811mapoutline1" title="1M65 Nails"></iframe>
<iframe class="mobile" src="./site-mobile.html?v=20260811mapoutline1" title="1M65 Nails phiên bản di động"></iframe>
  </main>
  <a class="manage-appointment-link" href="manage-booking.html" data-booking-modal-open>Xem lịch của bạn</a>
  <section class="booking-modal" id="booking-modal" role="dialog" aria-modal="true" aria-label="Xem lịch của bạn" hidden>
    <div class="booking-modal__panel">
      <button class="booking-modal__close" type="button" aria-label="Đóng cửa sổ quản lý lịch">
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="#4A3A80" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>
      </button>
      <iframe class="booking-modal__frame" id="booking-modal-frame" title="Xem lịch của bạn"></iframe>
    </div>
  </section>
  <script src="booking-management-modal.js?v=20260809-5"></script>
  <script src="booking-management-entry.js?v=20260809-8"></script>
  <script src="booking-ticket.js?v=20260811contact1"></script>
</body>
</html>
