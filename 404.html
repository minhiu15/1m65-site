  <script>
    // GitHub Pages serves this page for every missing path, at any depth. The site's root is the first
    // path segment on github.io (a project site) and "/" on the shop's own domain.
    function notFoundTarget(host, path) {
      var root = /\.github\.io$/.test(host) ? "/" + (path.split("/")[1] || "") + "/" : "/";
      var target = path;
      // V2 used to live under /v2/ before it became the site: old links (bill QR codes too) drop the "v2/".
      if (path.slice(0, root.length + 2) === root + "v2" && /^(\/|$)/.test(path.slice(root.length + 2))) target = root + path.slice(root.length + 3);
      // The admin lives once, at the site root: "/v2/admin", "/admin/" and the like all go there.
      if (/\/admin(\.html)?\/?$/.test(target)) target = root + "admin";
      // Other pages typed with a trailing slash: the same page without it.
      else if (target.length > root.length && /[^/]\/$/.test(target)) target = target.slice(0, -1);
      return { root: root, retry: target !== path ? target : null };
    }
    (function () {
      var target = notFoundTarget(location.hostname, location.pathname);
      if (target.retry) { location.replace(target.retry + location.search + location.hash); return; }
      document.write('<base href="' + target.root + '">');
    })();
  </script>
